name: TeamTask Deploy

on:
  workflow_run:
    workflows: ["TeamTask CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "20"
jobs:
    build-images:
        name: Build and Push Images
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
        outputs:
          backend-image: ${{ steps.image-names.outputs.backend-image }}
          frontend-image: ${{ steps.image-names.outputs.frontend-image }}
        steps:
          - name: Checkout source
            uses: actions/checkout@v4
            with:
              ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          - name: Prepare image names
            id: image-names
            run: |
              commit_sha="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
              owner="${GITHUB_REPOSITORY_OWNER,,}"
              repo="${GITHUB_REPOSITORY#*/}"
              repo="${repo,,}"

              # use commit SHA to tag images for immutability, and also push 'latest' tags for convenience
              backend_image="ghcr.io/${owner}/${repo}-backend:${commit_sha}"
              frontend_image="ghcr.io/${owner}/${repo}-frontend:${commit_sha}"

              echo "backend-image=${backend_image}" >> "$GITHUB_OUTPUT"
              echo "frontend-image=${frontend_image}" >> "$GITHUB_OUTPUT"
              echo "backend-latest=ghcr.io/${owner}/${repo}-backend:latest" >> "$GITHUB_OUTPUT"
              echo "frontend-latest=ghcr.io/${owner}/${repo}-frontend:latest" >> "$GITHUB_OUTPUT"
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: Login to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ github.token }}
          - name: Build and push backend image
            uses: docker/build-push-action@v6
            with:
              context: .
              file: Dockerfile
              push: true
              tags: |
                  ${{ steps.image-names.outputs.backend-image }}
                  ${{ steps.image-names.outputs.backend-latest }}
              cache-from: type=gha,scope=backend
              cache-to: type=gha,mode=max,scope=backend
          - name: Build and push frontend image
            uses: docker/build-push-action@v6
            with:
              context: ./frontend
              file: frontend/Dockerfile
              push: true
              build-args: |
                  VITE_API_BASE_URL=
                  VITE_SOCKET_URL=/socket.io
              tags: |
                  ${{ steps.image-names.outputs.frontend-image }}
                  ${{ steps.image-names.outputs.frontend-latest }}
              cache-from: type=gha,scope=frontend
              cache-to: type=gha,mode=max,scope=frontend
    update-manifests:
      name: Update GitOps image tags
      runs-on: ubuntu-latest
      needs: [build-images]
      steps:
        - uses: actions/checkout@v4
          with:
            ref: main
            fetch-depth: 0

        - name: Update image tags
          env:
            IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          run: |
            sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/g" \
              k8s/overlays/k3s/kustomization.yaml

        - name: Commit GitOps change
          env:
            IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add k8s/overlays/k3s/kustomization.yaml
            git commit -m "chore: deploy ${IMAGE_TAG} [skip ci]" || exit 0
            git push origin main
