name: TeamTask Deploy

on:
  workflow_run:
    workflows: ["TeamTask CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"
jobs:
    build-images:
        name: Build and Push Images
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
        outputs:
          backend-image: ${{ steps.image-names.outputs.backend-image }}
          frontend-image: ${{ steps.image-names.outputs.frontend-image }}
        steps:
          - name: Checkout source
            uses: actions/checkout@v4
            with:
              ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          - name: Prepare image names
            id: image-names
            run: |
              commit_sha="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
              owner="${GITHUB_REPOSITORY_OWNER,,}"
              repo="${GITHUB_REPOSITORY#*/}"
              repo="${repo,,}"

              # use commit SHA to tag images for immutability, and also push 'latest' tags for convenience
              backend_image="ghcr.io/${owner}/${repo}-backend:${commit_sha}"
              frontend_image="ghcr.io/${owner}/${repo}-frontend:${commit_sha}"

              echo "backend-image=${backend_image}" >> "$GITHUB_OUTPUT"
              echo "frontend-image=${frontend_image}" >> "$GITHUB_OUTPUT"
              echo "backend-latest=ghcr.io/${owner}/${repo}-backend:latest" >> "$GITHUB_OUTPUT"
              echo "frontend-latest=ghcr.io/${owner}/${repo}-frontend:latest" >> "$GITHUB_OUTPUT"
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          - name: Login to GitHub Container Registry
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ github.token }}
          - name: Build and push backend image
            uses: docker/build-push-action@v6
            with:
              context: .
              file: Dockerfile
              push: true
              tags: |
                  ${{ steps.image-names.outputs.backend-image }}
                  ${{ steps.image-names.outputs.backend-latest }}
              cache-from: type=gha,scope=backend
              cache-to: type=gha,mode=max,scope=backend
          - name: Build and push frontend image
            uses: docker/build-push-action@v6
            with:
              context: ./frontend
              file: frontend/Dockerfile
              push: true
              build-args: |
                  VITE_API_BASE_URL=
                  VITE_SOCKET_URL=/socket.io
              tags: |
                  ${{ steps.image-names.outputs.frontend-image }}
                  ${{ steps.image-names.outputs.frontend-latest }}
              cache-from: type=gha,scope=frontend
              cache-to: type=gha,mode=max,scope=frontend
    deploy:
        name: Deploy to Server
        runs-on: ubuntu-latest
        needs: [build-images]
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
        steps:
          - name: Deploy via SSH
            uses: appleboy/ssh-action@v1.2.0
            with:
                host: ${{ secrets.DEPLOY_HOST }}
                username: ${{ secrets.DEPLOY_USER }}
                key: ${{ secrets.DEPLOY_SSH_KEY }}
                script_stop: true
                script: |
                  set -euo pipefail
                  cd "${{ secrets.DEPLOY_PATH }}"
                    
                  git fetch --all --prune
                  git checkout main
                  git pull --ff-only origin main
                    
                  image_tag="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

                  render_dir="$(mktemp -d)"
                  trap 'rm -rf "$render_dir"' EXIT
                    
                  # Render a temporary overlay so the VM checkout stays clean
                  cp -R k8s "$render_dir/"
                  sed -i "s/newTag: v2/newTag: ${image_tag}/g" "$render_dir/k8s/overlays/k3s/kustomization.yaml"

                  echo "===> applying Traefik configuration"
                  sudo k3s kubectl apply -f \
                    "$render_dir/k8s/infra/traefik-acme.yaml"
                  sudo k3s kubectl rollout status deployment/traefik \
                    -n kube-system --timeout=180s
                    
                  echo "===> recreating migration Job"
                  sudo k3s kubectl delete job migrate-job \
                    -n teamtask --ignore-not-found
                    
                  echo "===> applying K3s manifests"
                  sudo k3s kubectl apply -k "$render_dir/k8s/overlays/k3s"
                    
                  echo "===> waiting for migration"
                  if ! sudo k3s kubectl wait \
                    --for=condition=complete job/migrate-job \
                    -n teamtask --timeout=180s; then
                    echo "ERROR: migration job failed"
                    sudo k3s kubectl logs job/migrate-job  \
                      -n teamtask -c migrate || true
                    exit 1
                  fi

                  echo "===> waiting for application rollout"
                  sudo k3s kubectl rollout status deployment/backend \
                    -n teamtask --timeout=180s
                  sudo k3s kubectl rollout status deployment/frontend \
                    -n teamtask --timeout=180s

                  sudo k3s kubectl get pods,job,ingress -n teamtask