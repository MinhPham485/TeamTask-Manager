apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teamtask

resources:
  - ../../base
  - teamtask-backend-sealedsecret.yaml
  - teamtask-postgres-sealedsecret.yaml

images:
  - name: teamtask-backend
    newName: ghcr.io/minhpham485/teamtask-manager-backend
    newTag: 54d4229dea2b2a085f0756524db584e025c4a284
  - name: teamtask-frontend
    newName: ghcr.io/minhpham485/teamtask-manager-frontend
    newTag: 54d4229dea2b2a085f0756524db584e025c4a284

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: teamtask
