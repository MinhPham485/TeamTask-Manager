apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teamtask

resources:
  - ../../base
  - teamtask-backend-sealedsecret.yaml
  - teamtask-postgres-sealedsecret.yaml

images:
  - name: teamtask-backend
    newName: ghcr.io/minhpham485/teamtask-manager-backend
    newTag: 0d93a92bc0fe9cde6b073f16f5f36c71fbdc2833
  - name: teamtask-frontend
    newName: ghcr.io/minhpham485/teamtask-manager-frontend
    newTag: 0d93a92bc0fe9cde6b073f16f5f36c71fbdc2833

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: teamtask
