apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: teamtask

resources:
  - ../../base

images:
  - name: teamtask-backend
    newName: ghcr.io/minhpham485/teamtask-manager-backend
    newTag: v2
  - name: teamtask-frontend
    newName: ghcr.io/minhpham485/teamtask-manager-frontend
    newTag: v2

patches:
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: teamtask
