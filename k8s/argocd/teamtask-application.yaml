apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamtask
  namespace: argocd
  labels:
    app.kubernetes.io/name: teamtask
    app.kubernetes.io/part-of: teamtask-manager
spec:
  project: default
  source:
    repoURL: https://github.com/MinhPham485/TeamTask-Manager.git
    targetRevision: main
    path: k8s/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: teamtask
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
