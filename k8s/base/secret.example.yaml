
apiVersion: v1
kind: Secret
metadata:
  name: teamtask-backend-secret
  namespace: teamtask
type: Opaque
stringData:
  DATABASE_URL: postgresql://teamtask:REPLACE_DB_PASSWORD@postgres:5432/teamtask?schema=public
  JWT_SECRET: REPLACE_WITH_A_LONG_RANDOM_SECRET
  GROQ_API_KEY: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  GCS_PRIVATE_KEY_BASE64: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: teamtask-postgres-secret
  namespace: teamtask
type: Opaque
stringData:
  POSTGRES_DB: teamtask
  POSTGRES_USER: teamtask
  POSTGRES_PASSWORD: REPLACE_DB_PASSWORD
