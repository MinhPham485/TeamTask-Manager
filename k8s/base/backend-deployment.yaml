apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: teamtask-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - npm
            - start
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: teamtask-backend-config
            - secretRef:
                name: teamtask-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
